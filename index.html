<body>
<div class="app">
  <aside class="side" id="sideWrap">
    <div class="side-brand"><h1 class="dash-title">Shaxsiy</h1></div>
    <nav id="side" aria-label="Sections"></nav>
  </aside>
  <div class="main">
    <header class="header" id="header">
      <span class="sync" id="sync" hidden><span class="sync-dot" id="syncDot"></span><span class="sync-txt" id="syncTxt"></span></span>
      <div class="h-actions">
        <button class="h-btn" data-act="openSearch" aria-label="Search" title="Ctrl+K"><svg class="ic" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg></button>
        <button class="h-btn" data-act="toggleTheme" aria-label="Theme" id="themeBtn"><svg class="ic" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z"/></svg></button>
        <button class="h-btn h-avatar" id="hAvatar" data-act="openProfile" aria-label="Profil" hidden></button>
      </div>
    </header>
    <main class="page" id="view" aria-live="polite"></main>
  </div>
</div>

<div class="more" id="more"></div>
<nav class="nav" id="nav" aria-label="Main tabs"></nav>

<div class="modal-bg" id="modalBg"></div>
<div class="toast" id="toast" role="status"></div>
<div class="palette" id="palette">
  <div class="pal">
    <input class="inp" id="paletteInp" data-input="palInput" placeholder="Qidirish… (Ctrl+K)" autocomplete="off">
    <div class="pal-res" id="paletteRes"></div>
  </div>
</div>

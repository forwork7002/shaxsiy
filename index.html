    <div class="side-brand"><h1 class="dash-title" id="sideTitle">Shaxsiy</h1><div class="small muted" id="sideDate"></div></div>

  <div class="main">

      <div class="h-left">

      </div>
      <div class="h-actions">
        <button class="btn icon" data-act="openSearch" aria-label="Search" title="Ctrl+K"><svg class="ic" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg></button>

        <div class="sync" title="sync"><span class="sync-dot" id="syncDot"></span><span id="syncTxt"></span></div>
      </div>
    </header>
    <main class="page" id="view" aria-live="polite"></main>
  </div>
